<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Redirecionando...</title>
  <script>
    const params = new URLSearchParams(window.location.search);
    const setor = params.get('setor');
    if (setor === 'hotel') {
      window.location.replace('dashboard-hotel.html');
    } else if (setor === 'fidelidade') {
      window.location.replace('dashboard-fidelidade.html');
    } else if (setor === 'google') {
      window.location.replace('dashboard-avaliacoes.html');
    } else {
      window.location.replace('dashboard-restaurante.html');
    }
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding-top: 50px; color: #F2EADF; background-color: #141210;">
  <p>Carregando dashboard do setor...</p>
</body>
</html>
